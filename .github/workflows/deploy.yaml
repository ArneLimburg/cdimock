name: build # Build and release master

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - id: checkout
        uses: actions/checkout@v4
      - id: setup-git
        run: |
          git config user.name arne
          git config user.email arne@apache.org
      - id: install-key
        name: Install gpg secret key
        run: |
          cat <(echo -e "${{ secrets.GPG_SECRET_KEY }}") | gpg --batch --import
      - id: install-jdk
        name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - id: setup-settings
        uses: s4u/maven-settings-action@v3.1.0
        with:
          servers: '[{"id": "central", "username": "${{ secrets.CENTRAL_USERNAME }}", "password": "${{ secrets.CENTRAL_PASSWORD }}"}]'
          override: true
      - id: weld-test
        name: Test with Weld
        run: mvn clean package -Pweld
      - id: owb-test
        name: Test with OpenWebBeans
        run: mvn clean package jacoco:report
      - id: maven-release
        name: Release
        run: |
          mvn -B release:prepare
          mvn release:perform -DreleaseProfiles=owb,release -Darguments=-Dgpg.passphrase=$GPG_PASSPHRASE
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

